<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎯</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Lottery · 数据工具与智能应用聚合站" />
    <!-- 字体：使用系统字体栈（PingFang SC / Segoe UI / Microsoft YaHei 等）。
         原先引用的 fonts.googleapis.com 在中国大陆会阻塞首屏渲染 1-2 秒，故移除。 -->
    <title>Lottery · 产品矩阵</title>
    <script>
      // 全局日/夜模式：渲染前同步算一次，避免暗色用户刷新时白屏闪烁（FOUC）。
      // 只有亮 / 暗两档，规则与 src/common/useTheme.ts 保持一致
      // （⚠️ 阈值与覆盖规则改动必须两处同步）：
      //   1) 默认按本地时段：07:00–17:59 亮色，其余暗色
      //   2) 手动切换（site_theme_override）在当前时段内优先，到期自动失效
      // 关键：new Date() 取的是**浏览器本地时间**，天然就是用户所在时区的墙上时间，
      // 因此不需要经纬度、不需要时区换算、不需要联网。
      (function () {
        try {
          var h = new Date().getHours();
          var night = h < 7 || h >= 18;
          var raw = localStorage.getItem("site_theme_override");
          if (raw) {
            var o = JSON.parse(raw);
            if (
              o &&
              (o.v === "day" || o.v === "night") &&
              typeof o.until === "number" &&
              Date.now() < o.until
            ) {
              night = o.v === "night";
            }
          }
          if (night) {
            document.documentElement.classList.add("site-night");
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
