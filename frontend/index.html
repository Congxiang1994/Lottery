<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎯</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Lottery · 数据工具与智能应用聚合站" />
    <!-- 字体：使用系统字体栈（PingFang SC / Segoe UI / Microsoft YaHei 等）。
         原先引用的 fonts.googleapis.com 在中国大陆会阻塞首屏渲染 1-2 秒，故移除。 -->
    <title>Lottery · 产品矩阵</title>
    <script>
      // 全局日/夜模式：渲染前同步主题，避免暗色用户刷新时白屏闪烁（FOUC）。
      // 状态由 src/common/useTheme.ts 读写，这里只做首次挂载。
      (function () {
        try {
          if (localStorage.getItem("site_theme") === "night") {
            document.documentElement.classList.add("site-night");
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
