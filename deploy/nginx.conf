server {
    listen 8081 default_server;
    listen [::]:8081 default_server;
    server_name doudoutech.cloud www.doudoutech.cloud;

    root /opt/lottery/frontend/dist;
    index index.html;

    # 文本资源压缩（Cloudflare 边缘也会压；这里保证直连 8081 / 回源也压）
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               application/xml image/svg+xml application/wasm;

    # API 反向代理到本地 gunicorn
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 带内容 hash 的构建产物：长缓存 immutable（前端每次构建文件名都会变）
    # 只写 add_header、不用 expires —— 两者并存会输出两条 Cache-Control（max-age 重复）
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 入口 HTML 不缓存：保证发版后立刻拿到新的 assets 引用
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # 汉字课视频静态服务（/data/hanzi，Nginx 直接文件服务，支持 Range 拖动进度）
    location /hanzi/ {
        alias /data/hanzi/;
        # 文件存在则直接服务视频；不存在（如 /hanzi/1 播放页路由）交给前端 SPA
        try_files $uri @hanzi_spa;
        add_header Accept-Ranges bytes;
        # 长缓存（30 天）：浏览器 + Cloudflare 边缘均缓存视频，二次播放/多用户秒开
        expires 30d;
        autoindex off;
    }

    # /hanzi/:num 播放页路由回退：视频文件不存在时返回前端 index.html（不继承视频长缓存）
    location @hanzi_spa {
        root /opt/lottery/frontend/dist;
        try_files /index.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # 屏蔽 /hanzi/ 下非视频文件（防下载脚本等敏感文件泄露），正则 location 优先于前缀 location
    location ~ ^/hanzi/.*\.(py|sh|txt|json|db|log|bak)$ {
        deny all;
    }

    # 儿歌本地视频静态服务（/data/song，yt-dlp 下载产物，支持 Range 拖动进度）
    location /song/ {
        alias /data/song/;
        add_header Accept-Ranges bytes;
        # 长缓存（30 天）：浏览器 + Cloudflare 边缘均缓存，二次播放秒开
        expires 30d;
        autoindex off;
    }

    # 屏蔽 /song/ 下非视频文件（防敏感文件泄露），正则 location 优先于前缀 location
    location ~ ^/song/.*\.(py|sh|txt|json|db|log|bak|jpg)$ {
        deny all;
    }

    # 前端 SPA：无扩展名的前端路由回退到 index.html
    # ⚠️ 回退目标改成命名 location @spa，不再直接给 /index.html ——
    # 否则 /.env、/wp-login.php、/.git/config 这类扫描路径会拿到 200 + HTML，
    # 访问管理里「谁在翻我的敏感文件」会显示成「命中 200」，信号完全失真。
    location / {
        try_files $uri $uri/ @spa;
    }

    # SPA 深链回退：/access、/story/12 这类无扩展名路径 → index.html
    # 探测类路径 → 404（不给扫描器「存在」的信号）。
    # ⚠️ 正则里用字符类 [.] 表示字面点，**不写 \.** —— nginx 引号内反斜杠的
    #    解析结果与直觉不符：实测 `(/\\.)|(\\.[A-Za-z0-9]{1,8}$)` 这种带反斜杠的
    #    交替正则对 /.git/config **匹配不上**，改 [.] 后立刻正常。
    # ⚠️ 两个 if 的顺序无所谓，但都只写 return（"if is evil" 只惩罚 return 之外的用法）。
    location @spa {
        # 末段带扩展名：/.env、/wp-login.php、/backup.zip
        if ($uri ~* "[.][A-Za-z0-9]{1,8}$") {
            return 404;
        }
        # 任一段以点开头：/.git/config、/.aws/credentials
        if ($uri ~ "/[.]") {
            return 404;
        }
        root /opt/lottery/frontend/dist;
        try_files /index.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
