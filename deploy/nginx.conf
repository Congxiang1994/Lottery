server {
    listen 8081 default_server;
    listen [::]:8081 default_server;
    server_name doudoutech.cloud www.doudoutech.cloud;

    root /opt/lottery/frontend/dist;
    index index.html;

    # API 反向代理到本地 gunicorn
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 汉字课视频静态服务（/data/hanzi，Nginx 直接文件服务，支持 Range 拖动进度）
    location /hanzi/ {
        alias /data/hanzi/;
        # 文件存在则直接服务视频；不存在（如 /hanzi/1 播放页路由）交给前端 SPA
        try_files $uri @hanzi_spa;
        add_header Accept-Ranges bytes;
        # 长缓存（30 天）：浏览器 + Cloudflare 边缘均缓存视频，二次播放/多用户秒开
        expires 30d;
        autoindex off;
    }

    # /hanzi/:num 播放页路由回退：视频文件不存在时返回前端 index.html（不继承视频长缓存）
    location @hanzi_spa {
        root /opt/lottery/frontend/dist;
        try_files /index.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # 屏蔽 /hanzi/ 下非视频文件（防下载脚本等敏感文件泄露），正则 location 优先于前缀 location
    location ~ ^/hanzi/.*\.(py|sh|txt|json|db|log|bak)$ {
        deny all;
    }

    # 前端 SPA：所有前端路由回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
